# Deploy when Pages → Source = "GitHub Actions".
# No workflow needed if you use Pages → "Deploy from a branch" instead (main / root).

name: Deploy static content to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Explicit permissions deny everything else — artifact upload needs actions:write.
permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Symlinks to local paths (e.g. outputs/node_modules) break tar on Linux — remove before archive.
      - name: Remove stray symlinks under outputs
        run: rm -rf outputs/node_modules 2>/dev/null || true

      # No configure-pages step — it uses Node 20 and often fails with exit 1; not required for static upload + deploy.

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
